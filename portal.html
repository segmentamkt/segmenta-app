<!DOCTYPE html>
<html lang="es">
<head>
<script>
(function(){
  if (location.hostname.endsWith('.vercel.app')) {
    location.replace('https://www.segmenta.online' + location.pathname + location.search + location.hash);
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal de Cliente · Segmenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--surface:#fff;--ink:#2d241d;--muted:#7c7065;--line:#e7dfd6;--sidebar:#2b1a0e;--brand:#e67c00;--brand2:#c66500;--soft:#fff0dd;--green:#2e9e6b;--red:#c74c3b;--display:'Space Grotesk',sans-serif;--body:'Inter',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
.shell{min-height:100vh;display:grid;grid-template-columns:238px 1fr}.sidebar{background:var(--sidebar);color:#fff;padding:20px 14px;display:flex;flex-direction:column;min-height:100vh}.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px}.logo-mark{width:38px;height:38px;border-radius:11px;background:var(--brand);display:grid;place-items:center;font-weight:800}.logo small{display:block;color:#bca996;font:700 10px var(--body);letter-spacing:.08em;margin-top:1px}.org-context{margin:28px 0 6px}.org-context label{display:block;color:#9d8978;font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;margin:0 8px 7px}.org-box{border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 11px;font-size:12px;font-weight:700;color:#fff}.sidebar-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:14px 8px 0}.sidebar-bottom b{display:block;font-size:12px}.sidebar-bottom .role{display:block;color:#aa9786;font-size:10px;margin-top:2px}.logout-link{margin-top:10px;border:0;background:transparent;color:#e7d8cc;padding:0;font-size:11px;font-weight:700;cursor:pointer}
.main{min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;gap:12px}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--ink)}.portal-pill{margin-left:auto;background:#e8f6ee;color:#27754f;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:800}.portal-loading{padding:48px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(35,24,15,.56);display:grid;place-items:center;padding:20px;z-index:50}.login-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.22)}.login-card h1{font:700 25px var(--display);margin:0 0 5px}.login-card p{margin:0 0 18px;color:var(--muted);font-size:12px;line-height:1.5}.field{margin-bottom:12px}.field label{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}.login-btn{width:100%;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:11px 13px;font-weight:800;cursor:pointer}.login-error{background:#fdecea;color:var(--red);border-radius:9px;padding:9px 10px;font-size:11px;margin-bottom:11px}
@media(max-width:820px){.shell{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 16px}}
</style>
<link rel="stylesheet" href="/crm-client-portal.css?v=20260924-2">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="logo"><div class="logo-mark">S</div><div>Segmenta<small>PORTAL CLIENTE</small></div></div>
    <div class="org-context"><label>Cliente</label><div class="org-box" id="orgContextName">Tu cuenta</div></div>
    <div id="clientNav"></div>
    <div class="sidebar-bottom">
      <b id="profileName">Cliente</b>
      <span class="role" id="profileRole">Portal de cliente</span>
      <button class="logout-link" onclick="logoutCrm()">Cerrar sesión</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="crumb">Portal / <b id="crumbTitle">Inicio</b></div>
      <span class="portal-pill">Acceso cliente</span>
    </header>
    <div id="portalBoot" class="portal-loading">Cargando tu cuenta…</div>
  </main>
</div>

<div class="modal hidden" id="portalLoginModal">
  <form class="login-card" onsubmit="portalLogin(event)">
    <h1>Portal de cliente</h1>
    <p>Ingresa con el acceso que Segmenta asignó a tu empresa.</p>
    <div class="login-error hidden" id="portalLoginError">Correo o contraseña incorrectos.</div>
    <div class="field"><label>Correo</label><input id="portalEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label>Contraseña</label><input id="portalPassword" type="password" autocomplete="current-password" required></div>
    <button class="login-btn" type="submit">Ingresar</button>
  </form>
</div>

<script>
window.crmSession=null;
function renderCrmSession(){
  const j=window.crmSession||{};
  document.getElementById('orgContextName').textContent=j.organization?.name||'Tu cuenta';
  document.getElementById('profileName').textContent=j.organization?.name||j.email||'Cliente';
  document.getElementById('profileRole').textContent='Portal de cliente';
  const boot=document.getElementById('portalBoot');if(boot)boot.classList.add('hidden');
}
function portalWorkspace(){return new URLSearchParams(location.search).get('workspace')||''}
function showPortalLogin(msg){
  if(msg){const e=document.getElementById('portalLoginError');e.textContent=msg;e.classList.remove('hidden')}
  document.getElementById('portalLoginModal').classList.remove('hidden');
}
async function portalSession(){
  let r=await fetch('/api/crm-auth',{cache:'no-store'}),j=await r.json();
  if(!j.authenticated){showPortalLogin();return false}
  const wanted=portalWorkspace();
  if(wanted&&j.organization?.slug!==wanted){
    const sw=await fetch('/api/crm-auth',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({org_slug:wanted})});
    if(!sw.ok){showPortalLogin('Este usuario no tiene acceso a esta cuenta.');return false}
    r=await fetch('/api/crm-auth',{cache:'no-store'});j=await r.json();
  }
  const preview=new URLSearchParams(location.search).get('client_preview')==='1';
  if(j.role!=='client'&&!preview){
    location.replace(j.platform_admin?'/host':'/crm');
    return false;
  }
  window.crmSession=j;
  document.getElementById('portalLoginModal').classList.add('hidden');
  renderCrmSession();
  return true;
}
async function portalLogin(e){
  e.preventDefault();
  document.getElementById('portalLoginError').classList.add('hidden');
  const r=await fetch('/api/crm-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    email:document.getElementById('portalEmail').value.trim(),
    password:document.getElementById('portalPassword').value,
    workspace:portalWorkspace()||undefined
  })});
  if(!r.ok){showPortalLogin('Correo o contraseña incorrectos.');return}
  document.getElementById('portalPassword').value='';
  await portalSession();
}
async function logoutCrm(){
  try{await fetch('/api/crm-auth',{method:'DELETE'})}catch(_){}
  window.crmSession=null;
  showPortalLogin();
}
</script>
<script src="/crm-client-portal.js?v=20260924-2"></script>
<script>portalSession();</script>
</body>
</html>
