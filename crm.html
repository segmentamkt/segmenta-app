<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Segmenta CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FCEAD3;--panel:#FFFDF9;--panel2:#FBF7E5;--brand:#E87F00;--brand2:#C96A00;--ink:#33210F;--muted:#8A6B48;--line:rgba(51,33,15,.12);--green:#2E9E6B;--red:#C0392B;--blue:#3B82F6;--display:'Space Grotesk',sans-serif;--body:'Inter',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(255,253,249,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{max-width:1500px;margin:auto;padding:13px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between}.brand{font-family:var(--display);font-weight:700;font-size:1.15rem}.brand span{color:var(--brand)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 13px;border-radius:10px;font-weight:700}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.dark{background:var(--ink);color:#fff}.btn:hover{transform:translateY(-1px)}
.wrap{max-width:1500px;margin:auto;padding:22px 20px 50px}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.head h1{font-family:var(--display);font-size:2rem;margin:0}.head p{margin:5px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.kpi .n{font-family:var(--display);font-weight:700;font-size:1.65rem}.kpi .l{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.filters input,.filters select{border:1px solid var(--line);background:#fff;padding:10px 11px;border-radius:9px;color:var(--ink)}.filters input{min-width:260px;flex:1}.board{display:grid;grid-template-columns:repeat(7,minmax(245px,1fr));gap:12px;overflow-x:auto;padding-bottom:12px}.col{background:rgba(255,253,249,.48);border:1px solid var(--line);border-radius:15px;min-height:520px;padding:10px}.colh{display:flex;align-items:center;justify-content:space-between;padding:5px 4px 10px;font-family:var(--display);font-weight:700}.count{font-family:var(--body);font-size:.75rem;color:var(--muted);background:var(--panel);padding:3px 7px;border-radius:999px;border:1px solid var(--line)}.cards{display:flex;flex-direction:column;gap:9px;min-height:450px}.lead{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;box-shadow:0 5px 16px rgba(51,33,15,.05)}.lead.dragging{opacity:.45}.lead h3{font-size:.95rem;margin:0 0 3px}.company{font-size:.78rem;color:var(--muted)}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.tag{font-size:.69rem;font-weight:700;padding:4px 7px;border-radius:999px;background:#F7E4C9;color:var(--brand2)}.tag.meta{background:#EAF2FF;color:#2563EB}.tag.hot{background:#E9F7F0;color:var(--green)}.meta{font-size:.76rem;color:var(--muted);line-height:1.45}.leadfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}.mini{border:none;background:transparent;color:var(--brand2);font-weight:700;font-size:.76rem;padding:0}.next{font-size:.69rem;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(37,24,11,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:40}.modal.open{display:flex}.box{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border-radius:18px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.24)}.boxh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.boxh h2{font-family:var(--display);margin:0;font-size:1.25rem}.form{padding:18px 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:.76rem;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px;color:var(--ink)}textarea{min-height:100px;resize:vertical}.boxf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.danger{color:var(--red);background:none;border:none;font-weight:700}.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:.82rem}
@media(max-width:950px){.kpis{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}.board{grid-template-columns:repeat(7,260px)}}@media(max-width:620px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{padding-left:12px;padding-right:12px}.topin{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="brand">SEGMENTA <span>CRM</span></div><div class="actions"><button class="btn" onclick="location.href='index.html'">Volver al sitio</button><button class="btn primary" onclick="openLead()">+ Nuevo lead</button></div></div></div>
<main class="wrap">
  <div class="head"><div><h1>Pipeline comercial</h1><p>Prospectos de Meta, WhatsApp y referidos en un solo lugar.</p></div><div class="actions"><button class="btn" onclick="exportCSV()">Exportar CSV</button><button class="btn dark" onclick="seedDemo()">Cargar demo</button></div></div>
  <section class="kpis"><div class="kpi"><div class="n" id="kTotal">0</div><div class="l">Leads activos</div></div><div class="kpi"><div class="n" id="kQualified">0</div><div class="l">Calificados</div></div><div class="kpi"><div class="n" id="kMeetings">0</div><div class="l">Reuniones</div></div><div class="kpi"><div class="n" id="kWon">0</div><div class="l">Ganados</div></div></section>
  <div class="filters"><input id="q" placeholder="Buscar nombre, negocio, teléfono, campaña..." oninput="render()"><select id="fService" onchange="render()"><option value="">Todos los servicios</option><option>Pauta</option><option>Integraciones</option><option>IA</option><option>Otro</option></select><select id="fSource" onchange="render()"><option value="">Todos los orígenes</option><option>Meta</option><option>WhatsApp</option><option>Referido</option><option>Web</option><option>Otro</option></select></div>
  <section class="board" id="board"></section>
</main>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box"><div class="boxh"><h2 id="modalTitle">Nuevo lead</h2><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="form"><div class="grid">
<div class="field"><label>Nombre</label><input id="name"></div><div class="field"><label>Negocio</label><input id="business"></div>
<div class="field"><label>Teléfono</label><input id="phone" placeholder="573001234567"></div><div class="field"><label>Correo</label><input id="email" type="email"></div>
<div class="field"><label>Servicio</label><select id="service"><option>Pauta</option><option>Integraciones</option><option>IA</option><option>Otro</option></select></div><div class="field"><label>Objetivo</label><select id="goal"><option>Ventas</option><option>Leads</option><option>Otro</option></select></div>
<div class="field"><label>Presupuesto aprox.</label><input id="budget" placeholder="$1.000.000"></div><div class="field"><label>Origen</label><select id="source"><option>Meta</option><option>WhatsApp</option><option>Referido</option><option>Web</option><option>Otro</option></select></div>
<div class="field"><label>Estado</label><select id="status"></select></div><div class="field"><label>Próxima acción</label><input id="nextAction" type="date"></div>
<div class="field"><label>Meta Lead ID</label><input id="metaLeadId"></div><div class="field"><label>Campaña</label><input id="campaign"></div>
<div class="field"><label>Conjunto</label><input id="adset"></div><div class="field"><label>Anuncio</label><input id="ad"></div>
<div class="field full"><label>Notas</label><textarea id="notes" placeholder="Contexto, objeciones, acuerdos, siguiente paso..."></textarea></div>
</div></div><div class="boxf"><button class="danger" id="deleteBtn" onclick="deleteLead()">Eliminar</button><div class="actions"><button class="btn" onclick="openWhatsApp()">WhatsApp</button><button class="btn primary" onclick="saveLead()">Guardar</button></div></div></div></div>
<script>
const STAGES=[['nuevo','Nuevo lead'],['contactado','Contactado'],['calificado','Calificado'],['reunion','Reunión agendada'],['propuesta','Propuesta enviada'],['ganado','Ganado'],['perdido','Perdido']];
const KEY='segmenta_crm_v1';let leads=JSON.parse(localStorage.getItem(KEY)||'[]');let editing=null;
function id(){return 'l_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)}function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function persist(){localStorage.setItem(KEY,JSON.stringify(leads))}
function visible(){let q=document.getElementById('q').value.toLowerCase(),sv=document.getElementById('fService').value,so=document.getElementById('fSource').value;return leads.filter(x=>(!sv||x.service===sv)&&(!so||x.source===so)&&(!q||[x.name,x.business,x.phone,x.email,x.campaign,x.ad].join(' ').toLowerCase().includes(q)))}
function render(){let data=visible();document.getElementById('board').innerHTML=STAGES.map(([key,label])=>{let arr=data.filter(x=>x.status===key);return `<div class="col" ondragover="event.preventDefault()" ondrop="dropLead(event,'${key}')"><div class="colh"><span>${label}</span><span class="count">${arr.length}</span></div><div class="cards">${arr.length?arr.map(card).join(''):'<div class="empty">Sin leads</div>'}</div></div>`}).join('');document.getElementById('kTotal').textContent=leads.filter(x=>!['ganado','perdido'].includes(x.status)).length;document.getElementById('kQualified').textContent=leads.filter(x=>x.status==='calificado').length;document.getElementById('kMeetings').textContent=leads.filter(x=>x.status==='reunion').length;document.getElementById('kWon').textContent=leads.filter(x=>x.status==='ganado').length}
function card(x){let phone=x.phone?`<button class="mini" onclick="event.stopPropagation();wa('${x.id}')">WhatsApp</button>`:'';return `<article class="lead" draggable="true" ondragstart="dragLead(event,'${x.id}')" onclick="openLead('${x.id}')"><h3>${esc(x.name||'Sin nombre')}</h3><div class="company">${esc(x.business||'Sin negocio')}</div><div class="tags"><span class="tag">${esc(x.service||'')}</span>${x.source==='Meta'?'<span class="tag meta">Meta</span>':''}${x.budget?'<span class="tag hot">'+esc(x.budget)+'</span>':''}</div><div class="meta">${esc(x.goal||'')} ${x.campaign?'· '+esc(x.campaign):''}<br>${x.phone?esc(x.phone):''}</div><div class="leadfoot"><span class="next">${x.nextAction?'Próx. '+esc(x.nextAction):'Sin próxima acción'}</span>${phone}</div></article>`}
function dragLead(e,i){e.dataTransfer.setData('text/plain',i);e.currentTarget.classList.add('dragging')}function dropLead(e,s){let i=e.dataTransfer.getData('text/plain'),x=leads.find(a=>a.id===i);if(x){x.status=s;x.updatedAt=new Date().toISOString();persist();render()}}
function fillStatus(){document.getElementById('status').innerHTML=STAGES.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}
function openLead(i){editing=i||null;fillStatus();let x=i?leads.find(a=>a.id===i):{status:'nuevo',service:'Pauta',goal:'Ventas',source:'Meta'};['name','business','phone','email','service','goal','budget','source','status','nextAction','metaLeadId','campaign','adset','ad','notes'].forEach(k=>document.getElementById(k).value=x?.[k]||'');document.getElementById('modalTitle').textContent=i?'Editar lead':'Nuevo lead';document.getElementById('deleteBtn').style.visibility=i?'visible':'hidden';document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function saveLead(){let data={};['name','business','phone','email','service','goal','budget','source','status','nextAction','metaLeadId','campaign','adset','ad','notes'].forEach(k=>data[k]=document.getElementById(k).value.trim());if(!data.name){document.getElementById('name').focus();return}if(editing){let x=leads.find(a=>a.id===editing);Object.assign(x,data,{updatedAt:new Date().toISOString()})}else leads.unshift({...data,id:id(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});persist();closeModal();render()}
function deleteLead(){if(!editing||!confirm('¿Eliminar este lead?'))return;leads=leads.filter(x=>x.id!==editing);persist();closeModal();render()}
function wa(i){let x=leads.find(a=>a.id===i);if(!x?.phone)return;window.open('https://wa.me/'+x.phone.replace(/\D/g,''),'_blank')}
function openWhatsApp(){if(editing)wa(editing);else{let p=document.getElementById('phone').value;if(p)window.open('https://wa.me/'+p.replace(/\D/g,''),'_blank')}}
function exportCSV(){let cols=['name','business','phone','email','service','goal','budget','source','status','nextAction','metaLeadId','campaign','adset','ad','notes'];let csv=[cols.join(','),...leads.map(x=>cols.map(k=>'"'+String(x[k]||'').replace(/"/g,'""')+'"').join(','))].join('\n');let b=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='segmenta-leads.csv';a.click();URL.revokeObjectURL(u)}
function seedDemo(){if(leads.length&&!confirm('Ya hay leads. ¿Agregar ejemplos igualmente?'))return;let now=new Date().toISOString();leads.unshift({id:id(),name:'Laura Gómez',business:'Clínica Nova',phone:'573001112233',email:'',service:'Pauta',goal:'Leads',budget:'$2.000.000',source:'Meta',status:'nuevo',nextAction:'',metaLeadId:'META-001',campaign:'Lead Ads | Clínica',adset:'Bogotá 25-45',ad:'Testimonio 01',notes:'Pidió información por formulario.',createdAt:now,updatedAt:now},{id:id(),name:'Carlos Ruiz',business:'Innova Home',phone:'573102223344',email:'',service:'Integraciones',goal:'Ventas',budget:'$3.000.000',source:'WhatsApp',status:'calificado',nextAction:'',metaLeadId:'',campaign:'',adset:'',ad:'',notes:'Necesita conectar leads con CRM y seguimiento.',createdAt:now,updatedAt:now},{id:id(),name:'Diana Torres',business:'Academia Pro',phone:'573153334455',email:'',service:'Pauta',goal:'Ventas',budget:'$1.500.000',source:'Referido',status:'reunion',nextAction:'',metaLeadId:'',campaign:'',adset:'',ad:'',notes:'Diagnóstico pendiente.',createdAt:now,updatedAt:now});persist();render()}
render();
</script>
</body>
</html>
