name: Integrate CRM into host panel

on:
  push:
    paths:
      - '.github/workflows/integrate-crm.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add CRM entry to host panel
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_tabs = "var tabs=['clientes','usuarios','planes'], labels={clientes:'Clientes',usuarios:'Usuarios',planes:'Planes'};"
          new_tabs = "var tabs=['crm','clientes','usuarios','planes'], labels={crm:'CRM',clientes:'Clientes',usuarios:'Usuarios',planes:'Planes'};"
          old_set = "function setHostTab(t){hostTab=t;renderHostShell();}"
          new_set = "function setHostTab(t){if(t==='crm'){window.parent.location.href='crm.html';return;}hostTab=t;renderHostShell();}"

          if old_tabs not in s:
              raise SystemExit('No se encontró la definición de tabs esperada; no se modificó index.html')
          if old_set not in s:
              raise SystemExit('No se encontró setHostTab esperado; no se modificó index.html')

          s = s.replace(old_tabs, new_tabs, 1)
          s = s.replace(old_set, new_set, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit integration
        run: |
          git config user.name "segmenta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Integrate CRM into host panel"
          git push
